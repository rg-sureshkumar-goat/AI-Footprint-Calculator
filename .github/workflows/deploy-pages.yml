# Publishes the calculator to GitHub Pages on every push to main.
# The site is static, so there is nothing to build: the repository root is
# uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run where the token is allowed to.
          # On a personal repository it usually is not: the default GITHUB_TOKEN
          # cannot call the create-Pages-site API and fails with "Resource not
          # accessible by integration", whatever permissions the workflow
          # declares. In that case Pages has to be turned on once by hand under
          # Settings -> Pages -> Source -> GitHub Actions. Left enabled because
          # it costs nothing and does work for org repos and PAT-backed runs.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
